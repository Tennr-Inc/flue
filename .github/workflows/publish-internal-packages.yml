name: Publish Internal Flue Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Internal semver shared by all four packages (for example, 2.0.3-tennr.2)
        required: true
        type: string
      dist-tag:
        description: npm dist-tag used by internal consumers
        required: true
        default: internal
        type: string

concurrency:
  # Serialize versions targeting the same channel so their four tag updates
  # cannot interleave. The publisher also rolls back partial tag promotion.
  group: publish-internal-packages-${{ inputs.dist-tag }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    if: github.repository == 'Tennr-Inc/flue' && github.actor == 'dleviminzi'
    environment: internal-package-publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@tennr-inc'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release tooling
        run: |
          pnpm exec biome check scripts/prepare-internal-packages.mjs scripts/publish-internal-packages.mjs scripts/prepare-internal-packages.test.mjs
          pnpm exec prettier --check .github/workflows/publish-internal-packages.yml INTERNAL_RELEASES.md package.json scripts

      - name: Build published packages
        run: pnpm --filter @flue/runtime --filter @flue/sdk --filter @flue/vite --filter @flue/opentelemetry build

      - name: Typecheck published packages
        run: pnpm --filter @flue/runtime --filter @flue/sdk --filter @flue/vite --filter @flue/opentelemetry check:types

      - name: Test packages with test suites
        run: pnpm --filter @flue/runtime --filter @flue/sdk --filter @flue/opentelemetry test

      - name: Test internal package preparation
        run: pnpm release:internal:test

      - name: Prepare internal packages
        env:
          INTERNAL_VERSION: ${{ inputs.version }}
        run: node scripts/prepare-internal-packages.mjs --version "$INTERNAL_VERSION"

      - name: Publish internal packages
        env:
          INTERNAL_DIST_TAG: ${{ inputs.dist-tag }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-internal-packages.mjs --tag "$INTERNAL_DIST_TAG"

      - name: Summarize release
        env:
          INTERNAL_DIST_TAG: ${{ inputs.dist-tag }}
          INTERNAL_VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## Internal Flue release"
            echo
            echo "Published all four packages as version \`$INTERNAL_VERSION\` with dist-tag \`$INTERNAL_DIST_TAG\`."
            echo
            echo "- \`@tennr-inc/flue-runtime\`"
            echo "- \`@tennr-inc/flue-sdk\`"
            echo "- \`@tennr-inc/flue-vite\`"
            echo "- \`@tennr-inc/flue-opentelemetry\`"
          } >> "$GITHUB_STEP_SUMMARY"
